[package]
name = "simdutf8"
version = "0.1.5"
authors = ["Hans Kratz <hans@appfour.com>"]
edition = "2018"
description = "SIMD-accelerated UTF-8 validation."
documentation = "https://docs.rs/simdutf8/"
homepage = "https://github.com/rusticstuff/simdutf8"
repository = "https://github.com/rusticstuff/simdutf8"
readme = "README.md"
keywords = ["utf-8", "unicode", "string", "validation", "simd"]
categories = ["encoding", "algorithms", "no-std"]
license = "MIT OR Apache-2.0"
exclude = [
    "/.gitignore",
    "/.github",
    "/.vscode",
    "/bench",
    "/fuzzing",
    "/img",
    "/inlining",
    "TODO.md",
]

[features]
default = ["std"]

# enable CPU feature detection, on by default, turn off for no-std support
std = []

# expose SIMD implementations in basic::imp::* and compat::imp::*
public_imp = []

# deprecated - does not do anything
aarch64_neon = []

# enable aarch64 prefetching for minor speedup - requires nightly
aarch64_neon_prefetch = []

armv7_neon = []

# make the portable SIMD public implementation available (experimental, nightly only)
portable_public_imp = ["public_imp"]

# deprecated - does not do anything
hints = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu", "wasm32-unknown-unknown", "wasm32-wasip1"]

[dependencies]
flexpect = "0.1.1"

# ETNA benchmark runner framework dependencies (used by src/bin/etna.rs
# and the etna module). Placed in main [dependencies] so the bin target
# links against them; they are only referenced from the workload harness.
proptest = "1.0"
quickcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/quickcheck", features = ["etna"] }
crabcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/crabcheck" }
hegeltest = "0.3.7"
rand = "0.9"

[build-dependencies]
rustversion = "1.0.22"

# [[bin]] for etna is auto-discovered from src/bin/etna.rs
